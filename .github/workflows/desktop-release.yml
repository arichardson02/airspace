# Builds the desktop app's installer and publishes it as a GitHub release whenever the app changes on main. Installed
# apps update from the latest release, and airspace.club/download points at its installer.
# Keep this file's name: the version comes from the workflow's run number, which starts over if it's renamed.
name: Desktop release

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "contracts/**"
      - "ui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".github/workflows/desktop-release.yml"
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in order; a newer push waits rather than cancelling one that's publishing.
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    # Installed apps take whatever release is latest, so only main publishes, even when run by hand.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: "0.1.${{ github.run_number }}"
      # electron-builder downloads its own copy of Electron to package.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @fs-career/contracts build

      # Not committed: the version only lives in this build, which bakes it into the app and its update metadata.
      - name: Set version
        working-directory: desktop
        run: npm pkg set "version=$env:VERSION"

      - run: pnpm --filter desktop build

      - name: Check artifacts
        working-directory: desktop/release
        run: |
          $files = "Airspace-Setup-$env:VERSION.exe", "Airspace-Setup-$env:VERSION.exe.blockmap", "latest.yml", "win-unpacked/resources/app-update.yml"
          foreach ($file in $files) { if (-not (Test-Path $file)) { throw "Missing $file" } }
          Get-Content latest.yml, win-unpacked/resources/app-update.yml
          # A fixed name, so /releases/latest/download/Airspace-Setup.exe is always the newest installer.
          Copy-Item "Airspace-Setup-$env:VERSION.exe" Airspace-Setup.exe

      # gh uploads every file before the release goes public, so installed apps never see it half uploaded.
      - name: Publish
        working-directory: desktop/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "desktop-v$env:VERSION"
          --target "$env:GITHUB_SHA"
          --title "Airspace $env:VERSION"
          --generate-notes
          --latest
          "Airspace-Setup-$env:VERSION.exe"
          "Airspace-Setup-$env:VERSION.exe.blockmap"
          latest.yml
          Airspace-Setup.exe
